[package]
name = "pack-index"
version = "0.1.0"
edition = "2021"
description = "SQLite catalog and inverted-index search for pack-agent projected modpacks"

[[bin]]
name = "pack-index"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
